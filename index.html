<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今天想說的話</title>
<!-- 結果便箋用的手寫字體：芫荽 Iansui（鉛筆手寫風，SIL OFL 授權） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F9D762;
    --note:#FAF5EA;
    --ink:#1a1a1a;
    --muted:#5b5236;
    --line:rgba(0,0,0,.78);
    --serif:"Microsoft JhengHei","微軟正黑體","PingFang TC","Heiti TC","Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:var(--serif);
    color:var(--ink);
    background:var(--bg);
    background-image:radial-gradient(rgba(255,255,255,.35) 1.2px,transparent 1.3px);
    background-size:18px 18px;
    line-height:1.9;
    -webkit-text-size-adjust:100%;
    padding:28px 16px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto}
  header{text-align:center;margin-bottom:22px}
  header h1{font-size:1.65rem;letter-spacing:.25em;font-weight:700}
  header p{font-size:.9rem;color:var(--muted);letter-spacing:.1em}

  /* 進度 */
  .progress{display:flex;justify-content:center;gap:8px;margin:0 0 18px}
  .progress span{width:9px;height:9px;border-radius:50%;background:rgba(0,0,0,.18);transition:.3s}
  .progress span.done{background:rgba(0,0,0,.55)}
  .progress span.now{background:var(--ink);transform:scale(1.35)}

  /* 便條紙 */
  .note{
    display:none;
    position:relative;
    background:var(--note);
    padding:44px 24px 26px;
    border-radius:2px 2px 18px 2px;
    box-shadow:0 1px 0 rgba(0,0,0,.05),0 12px 24px -10px rgba(90,60,0,.38);
    transform:rotate(-.6deg);
  }
  .note:nth-of-type(even){transform:rotate(.6deg)}
  .note.active{display:block;animation:in .45s ease both}
  .note.back{animation:inBack .45s ease both}
  @keyframes in{from{opacity:0;transform:translateX(30px) rotate(2deg)}to{opacity:1}}
  @keyframes inBack{from{opacity:0;transform:translateX(-30px) rotate(-2deg)}to{opacity:1}}
  .note::before{ /* 紙膠帶 */
    content:"";position:absolute;top:-12px;left:50%;width:110px;height:26px;
    transform:translateX(-50%) rotate(-2deg);
    background:rgba(255,255,255,.55);
    box-shadow:0 1px 2px rgba(0,0,0,.08);
  }
  .note::after{ /* 折角 */
    content:"";position:absolute;right:0;bottom:0;width:26px;height:26px;
    background:linear-gradient(135deg,var(--note) 50%,rgba(0,0,0,.08) 50%);
    border-radius:0 0 18px 0;
  }
  .qno{font-size:.85rem;letter-spacing:.2em;color:var(--muted);margin-bottom:10px}
  .q{font-size:1.12rem}
  .q{line-break:strict;word-break:normal}
  .hint-s.sub{display:block;line-height:1.3;margin:-2px 0 0 -.45em} /* 換到下一行並貼近上一行；抵銷全形括號左側空白 */
  .nb{white-space:nowrap} /* 讓標點黏在前一個欄位後，不落到行首 */
  .hint-s{font-size:.82rem;color:var(--muted)}

  /* 白色文字區域 */
  input.blank,textarea{
    font:inherit;color:var(--ink);
    background:transparent;border:none;border-radius:0;
    outline:none;-webkit-appearance:none;appearance:none;
  }
  input.blank{
    width:8em;max-width:100%;padding:0 6px;font-size:1.05rem;vertical-align:baseline;margin:3px 2px;
    border-bottom:1.5px solid var(--line);
  }
  input.blank.short{width:3.2em;text-align:center}
  input.blank:focus{border-bottom-width:2.5px}
  textarea{
    --lh:2.1rem;
    display:block;width:100%;min-height:calc(var(--lh) * 6 + 4px);margin-top:14px;
    padding:0 4px;font-size:1.05rem;line-height:var(--lh);resize:vertical;
    /* 每行一條黑色底線 */
    background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),rgba(0,0,0,.55) calc(var(--lh) - 1px),rgba(0,0,0,.55) var(--lh));
    background-size:100% var(--lh);
    background-attachment:local;
  }

  /* 選項 */
  .chips{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle;margin:3px 2px}
  .chip{
    font:inherit;font-size:1rem;cursor:pointer;
    padding:2px 14px;border-radius:999px;
    background:transparent;color:var(--ink);border:1.5px solid var(--line);
    transition:background .15s,color .15s,transform .1s;
    -webkit-tap-highlight-color:transparent;
  }
  .chip:active{transform:scale(.95)}
  .chip.on{background:var(--ink);color:var(--note)}

  input.missing{border-bottom-color:#c0392b !important}
  textarea.missing{background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1.5px),#c0392b calc(var(--lh) - 1px),#c0392b var(--lh)) !important}
  .chips.missing{border-radius:999px;padding:2px;border:1.5px dashed #c0392b}
  .err{min-height:1.5em;margin-top:8px;font-size:.88rem;color:#a93226;text-align:center}
  .shake{animation:shake .35s}
  @keyframes shake{25%{translate:-6px 0}50%{translate:6px 0}75%{translate:-3px 0}}

  /* 按鈕 */
  .nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
  .btn{
    font:inherit;font-size:1rem;letter-spacing:.15em;cursor:pointer;
    padding:10px 26px;border-radius:999px;border:1.5px solid var(--ink);
    background:var(--ink);color:var(--note);
    transition:transform .1s,opacity .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn[hidden]{display:none}
  .nav .spacer{flex:1}

  /* 結果頁 */
  #result{display:none;text-align:center}
  #result.active{display:block;animation:in .5s ease both}
  #result h2{font-size:1.2rem;letter-spacing:.2em;margin-bottom:14px}
  .paper-box{
    position:relative;background:#fff;padding:8px;border-radius:4px;
    box-shadow:0 14px 30px -12px rgba(90,60,0,.45);
    min-height:200px;
  }
  .paper-box img{display:block;width:100%;height:auto;border-radius:2px}
  .paper-box img + img{margin-top:8px}
  .page-label{font-size:.85rem;color:var(--muted);letter-spacing:.15em;margin:6px 0 2px}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);letter-spacing:.2em}
  .result-btns{display:flex;justify-content:center;gap:12px;margin-top:20px;flex-wrap:wrap}
  .tip{margin-top:12px;font-size:.82rem;color:var(--muted)}

  @media (max-width:420px){
    body{padding:22px 12px 32px}
    .note{padding:40px 18px 22px}
    .q{font-size:1.04rem}
    .btn{padding:10px 20px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>今天想說的話</h1>
    <p>寫下此刻的心情，留給自己，也留給他人</p>
  </header>

  <div class="progress" id="progress"></div>

  <main id="quiz">
    <!-- Q1 -->
    <section class="note">
      <div class="qno">Q1 ／ 6</div>
      <div class="q">
        我是<span class="nb"><input class="blank" name="name" maxlength="30" placeholder="可以化名" data-req>，</span>
        是<input class="blank short" name="age" maxlength="3" inputmode="numeric" placeholder="　" data-req>歲的生理
        <span class="nb"><span class="chips" data-name="gender" data-type="single" data-req>
          <button type="button" class="chip" data-v="男生">男生</button>
          <button type="button" class="chip" data-v="女生">女生</button>
        </span>。</span><br>
        今天我以
        <span class="chips" data-name="roles" data-type="multi" data-req>
          <button type="button" class="chip" data-v="倡議">倡議</button>
          <button type="button" class="chip" data-v="抵抗">抵抗</button>
          <button type="button" class="chip" data-v="支援">支援</button>
          <button type="button" class="chip" data-v="捲入">捲入</button>
          <button type="button" class="chip" data-v="見證">見證</button>
        </span>
        <span class="hint-s">（可複選）</span>的角色走了這條校園故事線。
      </div>
    </section>

    <!-- Q2 -->
    <section class="note">
      <div class="qno">Q2 ／ 6</div>
      <div class="q">在看完《共同的註腳》後，我發現二二八事件與我生活的地方…<span class="hint-s sub">（連結性？相異性？）</span></div>
      <textarea name="q2" maxlength="500" data-req></textarea>
    </section>

    <!-- Q3 -->
    <section class="note">
      <div class="qno">Q3 ／ 6</div>
      <div class="q">
        看完兩個展覽後，我
        <span class="chips" data-name="know" data-type="single" data-req>
          <button type="button" class="chip" data-v="有">有</button>
          <button type="button" class="chip" data-v="沒有">沒有</button>
        </span>
        更瞭解二二八事件。心情上我覺得…
      </div>
      <textarea name="q3" maxlength="500" data-req></textarea>
    </section>

    <!-- Q4 -->
    <section class="note">
      <div class="qno">Q4 ／ 6</div>
      <div class="q">
        其中，展覽
        <span class="chips" data-name="meet" data-type="single" data-req>
          <button type="button" class="chip" data-v="滿足">滿足</button>
          <button type="button" class="chip" data-v="未滿足">未滿足</button>
        </span>
        我看展前的期待，內容跟我認識的二二八事件有很多
        <span class="chips" data-name="same" data-type="single" data-req>
          <button type="button" class="chip" data-v="一樣">一樣</button>
          <button type="button" class="chip" data-v="不一樣">不一樣</button>
        </span>
        的地方，<span class="nb">例如…</span>
      </div>
      <textarea name="q4" maxlength="500" data-req></textarea>
    </section>

    <!-- Q5 -->
    <section class="note">
      <div class="qno">Q5 ／ 6</div>
      <div class="q">而我原本認識的二二八是…</div>
      <textarea name="q5" maxlength="500" data-req></textarea>
    </section>

    <!-- Q6 -->
    <section class="note">
      <div class="qno">Q6 ／ 6</div>
      <div class="q">
        最後，我真的好想跟<input class="blank" name="target" maxlength="30" data-req>說…
      </div>
      <textarea name="q6" maxlength="500" data-req></textarea>
    </section>

    <div class="err" id="err" aria-live="polite"></div>
    <div class="nav">
      <button type="button" class="btn ghost" id="prevBtn">上一題</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="nextBtn">下一題</button>
    </div>
  </main>

  <!-- 結果頁 -->
  <section id="result">
    <h2>我的回饋便箋</h2>
    <div class="paper-box">
      <div id="pages"></div>
      <div class="loading" id="loading">便箋書寫中…</div>
    </div>
    <div class="result-btns">
      <button type="button" class="btn ghost" id="restartBtn">重新測驗</button>
      <button type="button" class="btn" id="downloadBtn">下載結果</button>
    </div>
    <p class="tip">若手機無法直接下載，可長按上方圖片儲存。</p>
  </section>
</div>

  /* 底圖格線座標（以原圖 1832 × 2576 像素量測） */
  const GEO = {
    w: 1832, h: 2576,
    // 外框內緣與 13 條直線的 x 座標（左→右），共形成 14 欄
    xs: [69, 184.5, 306.5, 428, 550, 671.5, 793.5, 915, 1037, 1159, 1280.5, 1402.5, 1524.5, 1646.5, 1763],

  };
  const PENCIL_DARK = '#3d3d3f';   // 鉛筆深灰

  const FONT = '"Iansui","Microsoft JhengHei","微軟正黑體","PingFang TC","Heiti TC","Noto Sans TC",sans-serif';

  const notes = [...document.querySelectorAll('#quiz .note')];
  const TOTAL = notes.length;
  const quiz = document.getElementById('quiz');
  const result = document.getElementById('result');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const errBox = document.getElementById('err');
  const progress = document.getElementById('progress');
  const pagesBox = document.getElementById('pages');
  let pageCanvases = [];
  const loading = document.getElementById('loading');
  let cur = 0;

  /* ---------- 進度點 ---------- */
  for (let i = 0; i < TOTAL; i++) progress.appendChild(document.createElement('span'));
  function updateProgress(done) {
    [...progress.children].forEach((d, i) => {
      d.className = done ? 'done' : (i < cur ? 'done' : i === cur ? 'now' : '');
    });
  }

  /* ---------- 頁面切換 ---------- */
  function show(i, back) {
    cur = i;
    notes.forEach((n, k) => {
      n.classList.toggle('active', k === i);
      n.classList.toggle('back', k === i && !!back);
    });
    prevBtn.style.visibility = i === 0 ? 'hidden' : 'visible';
    nextBtn.textContent = i === TOTAL - 1 ? '完成' : '下一題';
    errBox.textContent = '';
    updateProgress(false);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---------- 選項按鈕 ---------- */
  document.querySelectorAll('.chips').forEach(group => {
    group.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
    group.addEventListener('click', e => {
      const b = e.target.closest('.chip');
      if (!b) return;
      if (group.dataset.type === 'single') {
        group.querySelectorAll('.chip').forEach(c => {
          const on = c === b;
          c.classList.toggle('on', on);
          c.setAttribute('aria-pressed', on);
        });
      } else {
        b.classList.toggle('on');
        b.setAttribute('aria-pressed', b.classList.contains('on'));
      }
      group.classList.remove('missing');
      errBox.textContent = '';
    });
  });
  document.querySelectorAll('input.blank, textarea').forEach(el => {
    el.addEventListener('input', () => { el.classList.remove('missing'); errBox.textContent = ''; });
  });

  /* ---------- 取值 ---------- */
  function chipVals(name) {
    const g = document.querySelector(`.chips[data-name="${name}"]`);
    return [...g.querySelectorAll('.chip.on')].map(c => c.dataset.v);
  }
  function fieldVal(name) {
    const el = document.querySelector(`[name="${name}"]`);
    return el ? el.value.trim() : '';
  }

  /* ---------- 檢查必填 ---------- */
  function validate(note) {
    let ok = true;
    note.querySelectorAll('[data-req]').forEach(el => {
      const empty = el.classList.contains('chips')
        ? el.querySelectorAll('.chip.on').length === 0
        : el.value.trim() === '';
      el.classList.toggle('missing', empty);
      if (empty) ok = false;
    });
    if (!ok) {
      errBox.textContent = '還有空格沒有填寫喔！';
      note.classList.remove('shake'); void note.offsetWidth; note.classList.add('shake');
      const first = note.querySelector('.missing');
      if (first && first.focus && !first.classList.contains('chips')) first.focus({ preventScroll: true });
    }
    return ok;
  }

  nextBtn.addEventListener('click', () => {
    if (!validate(notes[cur])) return;
    if (cur < TOTAL - 1) show(cur + 1);
    else finish();
  });
  prevBtn.addEventListener('click', () => { if (cur > 0) show(cur - 1, true); });

  /* ---------- 完成 → 結果頁 ---------- */
  function collect() {
    return {
      name: fieldVal('name'), age: fieldVal('age'),
      gender: chipVals('gender')[0] || '', roles: chipVals('roles'),
      q2: fieldVal('q2'), know: chipVals('know')[0] || '', q3: fieldVal('q3'),
      meet: chipVals('meet')[0] || '', same: chipVals('same')[0] || '', q4: fieldVal('q4'),
      q5: fieldVal('q5'), target: fieldVal('target'), q6: fieldVal('q6')
    };
  }

  function finish() {
    quiz.style.display = 'none';
    updateProgress(true);
    result.classList.add('active');
    pagesBox.innerHTML = ''; pageCanvases = [];
    loading.style.display = 'flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    const data = collect();
    sendToSheet(data);
    renderPaper(data).catch(err => {
      console.error(err);
      loading.textContent = '圖片產生失敗，請重新整理再試一次';
    });
  }

  /* 送出至 Google Sheet（背景送出，不影響結果頁） */
  function sendToSheet(d) {
    if (!SHEET_ENDPOINT) return;
    const payload = {
      name: d.name, age: d.age, gender: d.gender, roles: d.roles.join('、'),
      q2: d.q2, know: d.know, q3: d.q3, meet: d.meet, same: d.same, q4: d.q4,
      q5: d.q5, target: d.target, q6: d.q6
    };
    const body = JSON.stringify(payload);
    // text/plain 可避免跨網域預檢；sendBeacon 在關閉頁面時也能送出
    try {
      if (navigator.sendBeacon && navigator.sendBeacon(SHEET_ENDPOINT, new Blob([body], { type: 'text/plain;charset=utf-8' }))) return;
    } catch (e) {}
    fetch(SHEET_ENDPOINT, {
      method: 'POST', mode: 'no-cors', keepalive: true,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body
    }).catch(err => console.warn('送出失敗', err));
  }

  document.getElementById('restartBtn').addEventListener('click', () => {
    document.querySelectorAll('input.blank, textarea').forEach(el => { el.value = ''; el.classList.remove('missing'); });
    document.querySelectorAll('.chip').forEach(c => { c.classList.remove('on'); c.setAttribute('aria-pressed', 'false'); });
    document.querySelectorAll('.chips').forEach(g => g.classList.remove('missing'));
    result.classList.remove('active');
    quiz.style.display = '';
    show(0);
  });

  document.getElementById('downloadBtn').addEventListener('click', async () => {
    if (!pageCanvases.length) return;
    const multi = pageCanvases.length > 1;
    for (let i = 0; i < pageCanvases.length; i++) {
      const blob = await new Promise(r => pageCanvases[i].toBlob(r, 'image/png'));
      if (!blob) continue;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '今天想說的話_' + dateStamp() + (multi ? '_' + (i + 1) : '') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      if (i < pageCanvases.length - 1) await new Promise(r => setTimeout(r, 600));
    }
  });

  function dateStamp() {
    const d = new Date();
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  }

  /* =====================================================
     直式排版繪製
     ===================================================== */
  // 半形轉全形，直排時英數字直立
  function toFull(ch) {
    const c = ch.charCodeAt(0);
    if (ch === ' ') return '　';
    if (c >= 0x21 && c <= 0x7e) return String.fromCharCode(c + 0xfee0);
    return ch;
  }
  // 直排需轉 90° 的符號
  const ROTATE = new Set('（）《》〈〉「」『』【】〔〕［］｛｝…⋯—―－～＿'.split(''));
  // 不可置於行首的符號（溢出時掛在欄尾）
  const NO_START = new Set('，。、：；！？）》〉」』】〕］｝…⋯'.split(''));

  function chineseDate(d) {
    const num = '〇一二三四五六七八九';
    const y = String(d.getFullYear()).split('').map(n => num[+n]).join('');
    const cn = n => n <= 10 ? (n === 10 ? '十' : num[n])
      : n < 20 ? '十' + num[n - 10]
      : num[Math.floor(n / 10)] + '十' + (n % 10 ? num[n % 10] : '');
    return `${y}年${cn(d.getMonth() + 1)}月${cn(d.getDate())}日`;
  }

  function buildParas(d) {
    const Q = t => ({ t, a: false });
    const A = t => ({ t, a: true });
    return [
      [Q('我是'), A(d.name), Q('，是'), { t: d.age, a: true, tcy: true }, Q('歲的生理'), A(d.gender), Q('。今天我以'), A(d.roles.join('、')), Q('的角色走了這條校園故事線。')],
      [Q('在看完《共同的註腳》後，我發現二二八事件與我生活的地方'), A(d.q2)],
      [Q('看完兩個展覽後，我'), A(d.know), Q('更瞭解二二八事件。心情上我覺得'), A(d.q3)],
      [Q('其中，展覽'), A(d.meet), Q('我看展前的期待，內容跟我認識的二二八事件有很多'), A(d.same), Q('的地方，例如'), A(d.q4)],
      [Q('而我原本認識的二二八是'), A(d.q5)],
      [Q('最後，我真的好想跟'), A(d.target), Q('說：'), A(d.q6)]
    ];
  }

  // 段落 → 行（遇換行符號另起一欄）
  function paraToLines(segs) {
    const lines = [[]];
    segs.forEach(s => {
      const txt = s.t.replace(/\r/g, '').replace(/\n{2,}/g, '\n');
      if (s.tcy) { // 縱中橫：數字橫排於同一格
        const v = txt.replace(/\s+/g, '');
        if (v) lines[lines.length - 1].push({ ch: v, a: s.a, tcy: true });
        return;
      }
      for (const ch of txt) {
        if (ch === '\n') { lines.push([]); continue; }
        if (ch === '\t') continue;
        lines[lines.length - 1].push({ ch: toFull(ch), a: s.a });
      }
    });
    return lines.filter(l => l.length);
  }

  /* 依格線分欄；標點避開欄首、開括號避開欄尾 */
  const NO_END = new Set('（《〈「『【〔［｛'.split(''));
  function layoutCols(lines, perCol) {
    const cols = [];
    for (const line of lines) {
      let col = [];
      for (const cell of line) {
        if (col.length >= perCol) {
          let carry = [];
          if (NO_START.has(cell.ch)) {
            // 把前一字一起帶到下一欄，避免標點落在欄首
            while (col.length > 1 && carry.length < 2) {
              carry.unshift(col.pop());
              if (!NO_START.has(carry[0].ch)) break;
            }
          }
          while (col.length > 1 && NO_END.has(col[col.length - 1].ch)) carry.unshift(col.pop());
          cols.push(col); col = carry;
        }
        col.push(cell);
      }
      if (col.length) cols.push(col);
    }
    return cols;
  }

  function loadImage(src) {
    return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
  }

  async function fontsReady(text) {
    if (!document.fonts || !document.fonts.load) return;
    const t = new Promise(r => setTimeout(r, 4000));
    try {
      await Promise.race([
        Promise.all([
          document.fonts.load('400 40px "Iansui"', text)
        ]),
        t
      ]);
    } catch (e) { /* 使用系統字型 */ }
  }

  function drawChar(ctx, ch, x, y) {
    if (ROTATE.has(ch)) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 2); ctx.fillText(ch, 0, 0); ctx.restore();
    } else {
      ctx.fillText(ch, x, y);
    }
  }

  async function renderPaper(d) {
    const paras = buildParas(d);
    const lines = paras.flatMap(paraToLines);
    const dateStr = chineseDate(new Date());
    const allText = dateStr + lines.flat().map(c => c.ch).join('');
    const [paper] = await Promise.all([loadImage(PAPER_SRC), fontsReady(allText)]);

    const xs = GEO.xs;
    const nGaps = xs.length - 1;   // 14 欄（以黃色直線為界）
    const Y0 = GEO.top + GEO.pad;
    const Y1 = GEO.bottom - GEO.pad;
    const F = 64;                  // 固定字級
    const CELL = F * 1.12;         // 每字高度
    const perCol = Math.floor((Y1 - Y0) / CELL);

    const cols = layoutCols(lines, perCol);

    /* 分頁：每頁 14 欄內文；最後一頁的最左欄留給日期 */
    const pages = [];
    let i = 0;
    while (true) {
      const rem = cols.length - i;
      if (rem <= nGaps - 1) { pages.push(cols.slice(i)); break; }
      const take = rem === nGaps ? nGaps - 1 : nGaps;
      pages.push(cols.slice(i, i + take));
      i += take;
    }

    const gapX = g => (xs[g] + xs[g + 1]) / 2;

    pages.forEach((pageCols, p) => {
      const cv = document.createElement('canvas');
      cv.width = GEO.w; cv.height = GEO.h;
      const ctx = cv.getContext('2d');
      ctx.drawImage(paper, 0, 0, GEO.w, GEO.h);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (pages.length > 1) { // 頁碼（右下角，橫排小字）
        ctx.fillStyle = '#888';
        ctx.font = `400 30px ${FONT}`;
        ctx.fillText(`${p + 1} / ${pages.length}`, xs[nGaps] - 50, GEO.bottom + 24);
      }

      /* 內文：由右至左，每欄對齊黃線之間 */
      pageCols.forEach((col, ci) => {
        const x = gapX(nGaps - 1 - ci);
        col.forEach((c, k) => {
          // 鉛筆色：填答較深、題目較淺
          ctx.fillStyle = c.a ? PENCIL_DARK : PENCIL_LIGHT;
          ctx.font = `400 ${F}px ${FONT}`;
          const y = Y0 + CELL * k + CELL / 2;
          if (c.tcy) {
            const w = ctx.measureText(c.ch).width;
            const s = Math.min(1, (F * 0.98) / w);
            ctx.save(); ctx.translate(x, y); ctx.scale(s, 1); ctx.fillText(c.ch, 0, 0); ctx.restore();
          } else drawChar(ctx, c.ch, x, y);
        });
      });

      /* 日期：最後一頁左下角 */
      if (p === pages.length - 1) {
        const df = 50, dc = df * 1.12;
        ctx.fillStyle = PENCIL_LIGHT;
        ctx.font = `400 ${df}px ${FONT}`;
        const chars = [...dateStr];
        chars.forEach((ch, k) => drawChar(ctx, ch, gapX(0), Y1 - dc * (chars.length - k) + dc / 2));
      }

      pageCanvases.push(cv);
      if (pages.length > 1) {
        const lb = document.createElement('div');
        lb.className = 'page-label';
        lb.textContent = `第 ${p + 1} 頁 ／ 共 ${pages.length} 頁`;
        pagesBox.appendChild(lb);
      }
      const img = new Image();
      img.alt = `今天想說的話 回饋便箋 第 ${p + 1} 頁`;
      img.src = cv.toDataURL('image/png');
      pagesBox.appendChild(img);
    });

    loading.style.display = 'none';
  }

  show(0);
})();
</script>
</body>
</html>
